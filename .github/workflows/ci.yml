name: CI - api-back

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-api-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET SDK version in use
        run: dotnet --version

      - name: Read pinned engine version
        id: engine-version
        run: echo "ref=$(cat engine-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          repository: Astrea-EIP/core-moteur
          ref: ${{ steps.engine-version.outputs.ref }}
          path: engine

      - name: Build engine
        run: dotnet build engine/lib -c Release -o engine-build

      - name: Copy engine DLL
        run: |
          mkdir -p lib
          test -f engine-build/AstreaEngine.dll
          cp engine-build/AstreaEngine.dll lib/AstreaEngine.dll

      - name: Restore dependencies
        run: dotnet restore api-back.sln

      - name: Check formatting
        run: dotnet format api-back.sln --verify-no-changes

      - name: Build solution
        run: dotnet build api-back.sln --configuration Release --no-restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check OpenAPI contract is up to date
        run: |
          dotnet swagger tofile --openapiversion 3.1 --output /tmp/api.generated.json bin/Release/net8.0/api-back.dll v1
          diff -u docs/api.json /tmp/api.generated.json || { echo "docs/api.json is out of date — run scripts/update-api-contract.sh and commit the result"; exit 1; }

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.54.3 lint docs/api.json

      - name: Run tests
        run: |
          dotnet test api-back.sln -c Release --no-build \
            --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

      - name: Publish
        run: dotnet publish api-back.csproj -c Release -o out --no-build
