name: CI - api-back

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-api-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Read pinned engine version
        id: engine-version
        run: echo "ref=$(cat engine-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          repository: Astrea-EIP/core-moteur
          ref: ${{ steps.engine-version.outputs.ref }}
          path: engine

      - name: Build engine
        run: dotnet build engine/lib -c Release -o engine-build

      - name: Copy engine DLL
        run: |
          mkdir -p lib
          test -f engine-build/AstreaEngine.dll
          cp engine-build/AstreaEngine.dll lib/AstreaEngine.dll

      - name: Restore dependencies
        run: dotnet restore api-back.sln

      - name: Check formatting
        run: dotnet format api-back.sln --verify-no-changes

      - name: Build solution
        run: dotnet build api-back.sln --configuration Release --no-restore

      - name: Run tests
        run: |
          dotnet test api-back.sln -c Release --no-build \
            --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Publish
        run: dotnet publish api-back.csproj -c Release -o out --no-build
